<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE57F" />
      <stop offset="40%" stop-color="#FFC107" />
      <stop offset="75%" stop-color="#FF8F00" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Soundwave line smoothly flowing from left through the central flame to the right -->
  <path
    d="M 10 70 L 18 70 C 22 70, 24 62, 28 62 C 32 62, 34 78, 38 78 C 42 78, 44 48, 48 48 C 52 48, 54 88, 57 88 L 58 102 C 58 102, 59 75, 62 60 C 66 40, 72 26, 62 14 C 70 28, 72 40, 68 54 C 65 65, 60 76, 68 76 C 72 76, 74 62, 78 62 C 82 62, 84 78, 88 78 C 92 78, 94 68, 98 68 L 110 68"
    fill="none"
    stroke="url(#goldGradient)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#goldGlow)"
  />

  <!-- Inner flame feather curve -->
  <path
    d="M 64 36 C 72 48, 73 56, 68 68"
    fill="none"
    stroke="url(#goldGradient)"
    stroke-width="3"
    stroke-linecap="round"
    filter="url(#goldGlow)"
  />
</svg>
